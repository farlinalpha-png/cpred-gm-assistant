<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CP:RED — Table Display</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a14'/%3E%3Cpath d='M6 22 L16 6 L26 22 Z' fill='none' stroke='%2300e5ff' stroke-width='3'/%3E%3C/svg%3E">
<script src="./mapdata.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<style>
/* Offline by design: no webfont requests. The stack below degrades to the
   sharpest condensed/mono face each platform already has. */
:root{
  --neon:#00e5ff; --red:#ff1744; --gold:#ffd600; --green:#69f0ae;
  --dark:#0a0a14; --mid:#12121f; --surface:#1a1a2e; --border:#2a2a45;
  --text:#e0e0f0; --muted:#8b93ad;
  --display:'Orbitron','Rajdhani','Bahnschrift','DIN Alternate','Segoe UI Semibold',system-ui,sans-serif;
  --mono:'Share Tech Mono','Consolas','SF Mono','Menlo',monospace;
  /* Type scale: one unit ~= 1.28px on a 1080p TV, 2.5px on 4K, 0.9px on a
     tablet, so every size below is "px at 1080p" and stays proportional. */
  --u:calc(0.22px + 0.055vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060c;color:var(--text)}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;cursor:none}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}

/* ── Framing: vignette, scanlines, corner brackets ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#fx::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
#fx::after{content:'';position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)}
.brk{position:fixed;width:calc(var(--u)*34);height:calc(var(--u)*34);border:calc(var(--u)*.9) solid var(--gold);opacity:.5;z-index:6;pointer-events:none}
.brk.tl{top:calc(var(--u)*14);left:calc(var(--u)*14);border-right:0;border-bottom:0}
.brk.tr{top:calc(var(--u)*14);right:calc(var(--u)*14);border-left:0;border-bottom:0}
.brk.bl{bottom:calc(var(--u)*14);left:calc(var(--u)*14);border-right:0;border-top:0}
.brk.br{bottom:calc(var(--u)*14);right:calc(var(--u)*14);border-left:0;border-top:0}

#hud{position:fixed;inset:0;z-index:7;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(var(--u)*26) calc(var(--u)*30)}

/* ── Top row ── */
#top{display:flex;align-items:flex-start;justify-content:space-between;gap:calc(var(--u)*20)}
#ident{display:flex;gap:calc(var(--u)*14);align-items:stretch;
  background:linear-gradient(90deg,rgba(6,8,16,.86),rgba(6,8,16,0));
  padding:calc(var(--u)*10) calc(var(--u)*46) calc(var(--u)*10) calc(var(--u)*12);
  border-radius:calc(var(--u)*3)}
#accent{width:calc(var(--u)*4);background:var(--neon);box-shadow:0 0 calc(var(--u)*14) var(--neon);border-radius:2px}
#kicker{font-family:var(--mono);font-size:calc(var(--u)*11);letter-spacing:calc(var(--u)*3.4);
  color:var(--gold);text-transform:uppercase;margin-bottom:calc(var(--u)*4)}
#title{font-size:calc(var(--u)*40);font-weight:900;letter-spacing:calc(var(--u)*5);line-height:1;
  text-transform:uppercase;color:#fff;text-shadow:0 0 calc(var(--u)*22) rgba(0,229,255,.75)}
#subtitle{margin-top:calc(var(--u)*7);font-family:var(--mono);font-size:calc(var(--u)*15);
  letter-spacing:calc(var(--u)*2.2);color:#9fd8e8;text-transform:uppercase}

#status{display:flex;align-items:center;gap:calc(var(--u)*12);flex-shrink:0}
.pill{display:flex;align-items:center;gap:calc(var(--u)*7);
  padding:calc(var(--u)*7) calc(var(--u)*13);border:1px solid var(--border);border-radius:calc(var(--u)*3);
  background:rgba(8,10,20,.8);font-family:var(--mono);font-size:calc(var(--u)*13);
  letter-spacing:calc(var(--u)*2.4);text-transform:uppercase;color:var(--muted);white-space:nowrap}
#live{border-color:rgba(255,23,68,.55);color:#ff5c7a}
#live .dot{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;background:var(--red);
  box-shadow:0 0 calc(var(--u)*10) var(--red);animation:blip 1.6s ease-in-out infinite}
#live.off{border-color:var(--border);color:var(--muted)}
#live.off .dot{background:#3a3a55;box-shadow:none;animation:none}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
#badge{color:var(--gold);border-color:rgba(255,214,0,.45)}
#clock{color:#cfe9f5}

/* ── Lower third + ticker ── */
#bottom{display:flex;flex-direction:column;gap:calc(var(--u)*12)}
#caption{align-self:flex-start;max-width:78%;display:none;
  background:linear-gradient(90deg,rgba(6,8,16,.94),rgba(6,8,16,.55));
  border-left:calc(var(--u)*5) solid var(--neon);
  padding:calc(var(--u)*13) calc(var(--u)*28) calc(var(--u)*13) calc(var(--u)*18);
  box-shadow:0 0 calc(var(--u)*30) rgba(0,229,255,.18)}
#caption .tag{font-family:var(--mono);font-size:calc(var(--u)*11);letter-spacing:calc(var(--u)*3.2);
  color:var(--gold);text-transform:uppercase;margin-bottom:calc(var(--u)*5)}
#caption .body{font-size:calc(var(--u)*27);font-weight:600;letter-spacing:calc(var(--u)*.9);
  line-height:1.25;color:#fff}
#ticker{height:calc(var(--u)*34);border-top:1px solid rgba(0,229,255,.28);border-bottom:1px solid rgba(0,229,255,.28);
  background:rgba(6,8,16,.72);overflow:hidden;position:relative;display:flex;align-items:center}
#ticker .lead{flex:0 0 auto;height:100%;display:flex;align-items:center;
  padding:0 calc(var(--u)*14);background:var(--neon);color:#04121a;
  font-family:var(--mono);font-size:calc(var(--u)*13);letter-spacing:calc(var(--u)*2.6);font-weight:700}
#tickWrap{flex:1 1 auto;overflow:hidden;position:relative;height:100%}
#tickRun{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;
  white-space:nowrap;font-family:var(--mono);font-size:calc(var(--u)*15);letter-spacing:calc(var(--u)*2);
  color:#a9e7f7;will-change:transform}
#tickRun span{padding:0 calc(var(--u)*10)}
@keyframes tickrun{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#tickRun i{color:var(--gold);font-style:normal;padding:0 calc(var(--u)*4)}

/* ── Slate (standby / no link) ── */
#slate{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(var(--u)*16);
  background:radial-gradient(ellipse at center,rgba(5,6,12,.55) 0%,rgba(5,6,12,.9) 70%);
  pointer-events:none;text-align:center;padding:calc(var(--u)*40)}
#slate.on{display:flex}
#slateMark{font-family:var(--mono);font-size:calc(var(--u)*13);letter-spacing:calc(var(--u)*7);
  color:var(--gold);text-transform:uppercase}
#slateTitle{font-size:calc(var(--u)*62);font-weight:900;letter-spacing:calc(var(--u)*10);
  text-transform:uppercase;color:#fff;text-shadow:0 0 calc(var(--u)*30) rgba(0,229,255,.6)}
#slateSub{font-family:var(--mono);font-size:calc(var(--u)*17);letter-spacing:calc(var(--u)*2.6);
  color:#8fb6c8;text-transform:uppercase;max-width:60ch;line-height:1.7}
#slateBar{width:calc(var(--u)*260);height:calc(var(--u)*3);background:rgba(0,229,255,.16);overflow:hidden}
#slateBar b{display:block;height:100%;width:34%;background:var(--neon);
  box-shadow:0 0 calc(var(--u)*12) var(--neon);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

/* ── Link indicator ── */
#link{position:fixed;right:calc(var(--u)*30);bottom:calc(var(--u)*30);z-index:9;
  display:flex;align-items:center;gap:calc(var(--u)*8);font-family:var(--mono);
  font-size:calc(var(--u)*12);letter-spacing:calc(var(--u)*2);color:var(--muted);
  text-transform:uppercase;pointer-events:none;opacity:.85}
#link .dot{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:var(--green);
  box-shadow:0 0 calc(var(--u)*9) var(--green)}
#link.bad{color:#ff8fa3}
#link.bad .dot{background:var(--red);box-shadow:0 0 calc(var(--u)*9) var(--red);animation:blip 1s infinite}

#fatal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:#05060c;color:var(--red);font-family:var(--mono);font-size:calc(var(--u)*16);
  text-align:center;padding:calc(var(--u)*40);line-height:1.9;white-space:pre-wrap}
</style>
</head>
<body>

<div id="stage"></div>
<div id="fx"></div>
<div class="brk tl"></div><div class="brk tr"></div><div class="brk bl"></div><div class="brk br"></div>

<div id="hud">
  <div id="top">
    <div id="ident">
      <div id="accent"></div>
      <div>
        <div id="kicker">Night City // Live Feed</div>
        <div id="title">NIGHT CITY</div>
        <div id="subtitle">awaiting gm feed</div>
      </div>
    </div>
    <div id="status">
      <div class="pill" id="badge" style="display:none"><span id="badgeText">—</span></div>
      <div class="pill" id="live"><span class="dot"></span><span id="liveText">Standby</span></div>
      <div class="pill" id="clock">--:--</div>
    </div>
  </div>

  <div id="bottom">
    <div id="caption"><div class="tag">GM</div><div class="body" id="captionText"></div></div>
    <div id="ticker">
      <div class="lead" id="tickLead">NCPD BAND</div>
      <div id="tickWrap"><div id="tickRun"></div></div>
    </div>
  </div>
</div>

<div id="slate">
  <div id="slateMark">CP:RED GM Assistant</div>
  <div id="slateTitle">STAND BY</div>
  <div id="slateSub">waiting for the gm to start the feed</div>
  <div id="slateBar"><b></b></div>
</div>

<div id="link"><span class="dot"></span><span id="linkText">connecting</span></div>
<div id="fatal"></div>

<script type="module">
// TV browsers cache modules hard. Opening the display with ?v=<anything>
// (the GM panel's "force refresh" does this) pulls a fresh copy of the whole
// module chain instead of making someone find the TV's settings menu.
const v = new URLSearchParams(location.search).get('v');
import('./map3d/display.js' + (v ? '?v=' + encodeURIComponent(v) : ''))
  .catch(err => {
    const el = document.getElementById('fatal');
    el.style.display = 'flex';
    el.textContent = '// display failed to load\n\n' + (err && err.message || err);
  });
</script>
</body>
</html>
